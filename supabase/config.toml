# Local Supabase project configuration for Forge — used by `supabase start`
# / `supabase db reset` against a local Docker stack only. Nothing here is a
# real credential: the local anon/service keys the CLI prints at `supabase
# start` are fixed, publicly-known local-dev defaults, never valid against
# any real project. See supabase/README.md for the full secrets policy.
project_id = "forge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
# Disabled for local backend-verification runs: Studio is a UI dashboard
# only, has zero bearing on SQL/RLS/RPC correctness, and this machine's
# tight Docker-VM memory budget makes every extra concurrently-starting
# container more likely to miss its own health-check window under load.
# Re-enable freely for interactive local development.
enabled = false
port = 54323

[inbucket]
enabled = false

[realtime]
# Disabled: nothing in this project (Flutter app, migrations, or Edge
# Functions) subscribes to or depends on Supabase Realtime — grep confirms
# zero references anywhere under lib/ or supabase/. On this local dev
# machine, the bundled Realtime container's Erlang/BEAM runtime crashes
# with SIGILL ("Illegal instruction") during its own self-hosted seed step,
# a JIT/CPU-feature incompatibility specific to this virtualized Docker
# environment — unrelated to Postgres, RLS, or any of this project's own
# schema/functions. Disabling an unused optional service to work around an
# environment quirk, not a workaround for anything under test.
enabled = false

[storage]
# Disabled for local backend-verification runs: grep confirms zero
# references to Supabase Storage anywhere in lib/ — this project never
# uses it — and removing it from the startup set reduces resource
# contention among the containers our actual SQL/RLS/RPC tests do
# depend on, on a machine with a tight Docker-VM memory budget.
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[analytics]
enabled = false
