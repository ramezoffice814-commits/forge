name: forge
description: "CAN — daily discipline challenge app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Roadmap Item 19: RC versioning strategy — <base-version>-rc.<n>+<build>.
# No prior versioning policy existed in this repo (first real release
# candidate), so this establishes one: the base version (1.0.0) stays
# fixed through the RC series, `-rc.N` increments per release
# candidate, and the build number after `+` increments on every build
# regardless of RC number (Android's versionCode must strictly
# increase between uploads). Drop the `-rc.N` suffix entirely for the
# actual 1.0.0 release once one is approved.
# Roadmap Item 20: rc.1 -> rc.2, build 2 -> 3 (release/store submission
# prep round — see docs/RELEASE_CANDIDATE_2.md).
# Roadmap Item 21: rc.2 -> rc.3, build 3 -> 4 (CAN rebrand + cinematic
# opening round — see docs/CAN_REBRAND_AUDIT.md). Still not the final
# 1.0.0 release; the -rc.N suffix stays until one is actually approved.
# Roadmap Item 22: rc.3 -> beta.1, build 4 -> 5 (Free Public Beta Launch
# — see docs/FREE_BETA_RELEASE.md). Deliberate identifier switch, not
# just a number bump: "-rc." (release candidate) implies "nearly ready
# for the final production release," which was accurate for the
# internal hardening track (Items 18-20) but is misleading for what
# this build actually is — the first version real external users will
# install and use, with known rough edges and mock-only AI/Transmission
# content. "-beta.N" says that honestly. Build number keeps
# incrementing regardless of the label change (Android's versionCode
# must strictly increase across every upload, beta or not).
# Roadmap Item 22 (fix): beta.1 -> beta.2, build 5 -> 6. Build 5's
# signed APK installed and launched on a real Android device but
# crashed immediately at startup (assertAuthRepositoryConfigIsSafe/
# assertBackendModeConfigIsSafe correctly refused to let a *release*
# build run against the *mock* backend, not yet knowing an intentional
# public-beta build was a legitimate exception to that rule — see
# docs/ANDROID_BETA_DEVICE_TEST.md and docs/FREE_BETA_RELEASE.md). Build
# 5 was never a working app on a real device, so this bumps the beta
# identifier (not just the build number) to honestly mark it as a new,
# fixed iteration rather than a patch to something that ever ran.
# Roadmap Item 22 (Mobile Polish Pass 1): beta.2 -> beta.3, build 6 -> 7.
# Build 6 was verified working on a real device (in-place update over
# beta.1, startup/core-navigation smoke test all PASS — see
# docs/ANDROID_BETA_DEVICE_TEST.md) but the same real-device pass
# surfaced mobile UI polish issues (bottom-nav content clearance,
# missing bodySmall typography, non-responsive level ring — see
# docs/FREE_BETA_RELEASE.md). This build carries those fixes; it has not
# yet itself been built/signed/device-tested.
version: 1.0.0-beta.3+7

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  flutter_secure_storage: ^10.3.1
  supabase_flutter: ^2.16.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled so `google_fonts` resolves these two weights from the app's
  # own asset bundle instead of a network fetch — required for
  # deterministic golden tests (GoogleFonts.config.allowRuntimeFetching
  # is false in tests). See assets/fonts/README.md for provenance/license.
  assets:
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Medium.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
